name: Create Release
run-name: "release ${{ inputs.version || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (optional, e.g. 1.2.3)"
        required: false
        type: string

concurrency: ${{ github.workflow }}

permissions:
  contents: write

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup git committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: version
        run: bun run script/version.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TILT_TUI_BUMP: ${{ inputs.bump }}
          TILT_TUI_VERSION: ${{ inputs.version }}

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - run: bun install
        env:
          # Use a per-job cache dir instead of the shared self-hosted-runner
          # cache. Cross-compiling downloads target Bun runtimes into this
          # cache; a corrupt/incomplete download would otherwise persist and
          # break every subsequent run. runner.temp is fresh each job.
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache

      - name: Build cross-platform binaries
        run: bun run build:binary
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tilt-tui-binaries
          path: dist/
          include-hidden-files: true

  publish:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: tilt-tui-binaries
          path: dist/

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/tilt-tui-*/bin/tilt-tui)
          assets=()
          for f in "${files[@]}"; do
            platform=$(basename "$(dirname "$(dirname "$f")")")
            cp "$f" "$platform"
            assets+=("$platform")
          done
          gh release upload "${{ needs.version.outputs.tag }}" "${assets[@]}" --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          generated=$(gh release view "$TAG" --json body -q .body)
          {
            bun run script/install-notes.ts "$REPO" "$TAG" --stable
            echo
            echo "$generated"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
